[project]
name = "fingate"
version = "0.1.0"
description = "Contract-gated financial data serving pipeline"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.0",
    "python-dateutil>=2.9",
]

[project.scripts]
fingate-run = "fingate.pipeline:main"
fingate-gate = "fingate.gate.cli:main"
fingate-query = "fingate.warehouse.query_cli:main"
fingate-review = "fingate.review.cli:main"
fingate-ask = "fingate.agent.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5"]
# 에이전트 계층만 필요로 한다. 수집·계약·게이트·리뷰어는 이것 없이 동작하고
# CI 도 자격 증명 없이 돈다.
agent = ["anthropic>=0.69"]
# 같은 에이전트 루프를 Gemini 로도 돌린다. 어댑터만 다르고 근거 고정은 공통이다.
agent-gemini = ["google-genai>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fingate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
