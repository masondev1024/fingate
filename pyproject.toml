[project]
name = "fingate"
version = "0.1.0"
description = "Contract-gated financial data serving pipeline"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.0",
    "python-dateutil>=2.9",
]

[project.scripts]
fingate-run = "fingate.pipeline:main"
fingate-gate = "fingate.gate.cli:main"
fingate-query = "fingate.warehouse.query_cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fingate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
