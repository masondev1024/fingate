name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        # agent-gemini 까지 넣는다. 넣지 않으면 어댑터 테스트가 importorskip 으로
        # 조용히 건너뛰어, 깨져도 CI 가 녹색으로 남는다. 자격 증명은 여전히 필요 없다.
        run: uv sync --extra dev --extra agent-gemini

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # 외부 API 자격 증명 없이 돌아야 한다. 수집기 테스트는 전송 계층을
      # 주입해 네트워크를 타지 않는다.
      - name: Test
        run: uv run pytest -q
